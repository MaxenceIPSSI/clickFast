<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="style.css" />
    <title>ClickFast</title>
  </head>
  <body>
    <div id="main">
      <div id="container">
        <h1 class="flex-center">ClickFast</h1>
        <p class="catchphrase">Sois le plus rapide des clickers du game ⚡</p>

        <p id="chrono">5.0 s</p>

        <div class="flex-center" id="zone-jeu">
          <button id="button-clicker" type="button">
            <span id="score" class="number">0</span>
            <span class="label">Clique !</span>
          </button>
        </div>

        <div class="flex-center">
          <button id="button-rejouer" type="button" hidden>Rejouer</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
