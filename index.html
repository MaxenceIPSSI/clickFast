<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="style.css" />
    <title>ClickFast</title>
  </head>
  <body>
    <div id="main">
      <div id="container">
        <h1 class="flex-center">ClickFast</h1>
        <p class="catchphrase">Sois le plus rapide des clickers du game ⚡</p>

        <div class="flex-center">
          <input
            id="username"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="Ton pseudo"
          />
        </div>

        <p id="chrono">5.0 s</p>

        <div class="flex-center" id="zone-jeu">
          <button id="button-clicker" type="button">
            <span id="score" class="number">0</span>
            <span class="label">Clique !</span>
          </button>

          <section id="classement" hidden>
            <div id="colonnes-classement">
              <div>
                <h2>Classement local</h2>
                <ol id="classement-liste"></ol>
              </div>
              <div>
                <h2>Classement national</h2>
                <ol id="classement-national"></ol>
              </div>
            </div>
            <p id="message-envoi"></p>
            <p id="message-national"></p>
          </section>
        </div>

        <div class="flex-center">
          <button id="button-rejouer" type="button" hidden>Rejouer</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
