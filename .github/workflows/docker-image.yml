name: Docker Image

on:
  push:
    branches: ["main", "develop", "j2", "j3"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clickfast
            context: .
          - image: clickfast-scores-api
            context: ./scores-api
          - image: clickfast-stats-api
            context: ./stats_api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Le process ne tourne pas en root
        run: |
          utilisateur=$(docker run --rm ${{ matrix.image }}:${{ github.sha }} whoami)
          echo "utilisateur du conteneur : $utilisateur"
          test "$utilisateur" != "root"

      - name: Taille de l'image
        run: docker images ${{ matrix.image }}:${{ github.sha }} --format '{{.Size}}'

  smoke:
    name: le jeu repond vraiment
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image du jeu
        run: docker build -t clickfast:ci .

      - name: Le conteneur sert bien le jeu
        run: |
          docker run -d --name clickfast-ci -p 8080:8080 clickfast:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080 | grep -q "ClickFast"
          curl -fsS -o /dev/null http://127.0.0.1:8080/script.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/style.css

      - name: Rien d'autre que le site dans l'image
        run: |
          contenu=$(docker run --rm clickfast:ci ls /usr/share/nginx/html | sort | tr '\n' ' ')
          echo "contenu servi : $contenu"
          test "$contenu" = "index.html script.js style.css "

  compose:
    name: les fichiers compose sont valides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Un .env reconstruit depuis le template suffit
        run: cp .env.example .env

      - name: Validation des deux stacks
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
