name: CI

on:
  push:
    branches: ["main", "develop", "j2", "j3"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY_NAMESPACE: maxenceg18

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run lint

  test:
    name: tests unitaires
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm test

  build-and-push:
    name: publier ${{ matrix.image }}
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clickfast
            context: .
          - image: clickfast-scores-api
            context: ./scores-api
          - image: clickfast-stats-api
            context: ./stats_api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Rappeler le tag publie
        run: echo "publie ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}"
