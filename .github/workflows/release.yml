name: Release

on:
  push:
    branches: ["main", "j3"]
  workflow_dispatch:

env:
  REGISTRY_NAMESPACE: maxenceg18

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    name: tests unitaires
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm test

  security-deps:
    name: securite des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Relever le compte des alertes
        run: |
          npm audit --json > audit-racine.json || true
          (cd scores-api && npm audit --json > ../audit-scores.json) || true
          python3 - <<'FIN' > rapport-deps.json
          import json
          def lire(f):
              try:
                  return json.load(open(f)).get("metadata", {}).get("vulnerabilities", {})
              except Exception:
                  return {}
          racine, scores = lire("audit-racine.json"), lire("audit-scores.json")
          somme = lambda d: sum(d.get(k, 0) for k in ("high", "critical"))
          print(json.dumps({
              "racine_high_critical": somme(racine),
              "scores_high_critical": somme(scores),
              "racine_detail": racine,
              "scores_detail": scores,
          }))
          FIN
          cat rapport-deps.json

      - uses: actions/upload-artifact@v4
        with:
          name: rapport-deps
          path: rapport-deps.json

      - name: Dependances du jeu et de l outillage
        run: npm audit --audit-level=high

      - name: Dependances de l API de scores
        working-directory: scores-api
        run: npm audit --audit-level=high

      - name: Recherche de secrets dans tout l historique
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: publier ${{ matrix.image }}
    needs: test
    environment: production
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clickfast
            context: .
          - image: clickfast-scores-api
            context: ./scores-api
          - image: clickfast-stats-api
            context: ./stats_api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Rappeler le tag publie
        run: echo "publie ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}"

  security-image:
    name: securite de l image ${{ matrix.image }}
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [clickfast, clickfast-scores-api, clickfast-stats-api]
    steps:
      - name: Scan Trivy du tag qui vient d etre publie
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          format: json
          output: trivy-${{ matrix.image }}.json

      - name: Compter les vulnerabilites trouvees
        run: |
          python3 - <<'FIN' > rapport-image-${{ matrix.image }}.json
          import json
          d = json.load(open("trivy-${{ matrix.image }}.json"))
          hauts = crit = 0
          for r in d.get("Results") or []:
              for v in r.get("Vulnerabilities") or []:
                  if v["Severity"] == "CRITICAL": crit += 1
                  else: hauts += 1
          print(json.dumps({"image": "${{ matrix.image }}", "high": hauts, "critical": crit}))
          FIN
          cat rapport-image-${{ matrix.image }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: rapport-image-${{ matrix.image }}
          path: rapport-image-${{ matrix.image }}.json

      - name: Bloquer si HIGH ou CRITICAL
        run: |
          total=$(python3 -c "import json;d=json.load(open('rapport-image-${{ matrix.image }}.json'));print(d['high']+d['critical'])")
          echo "${{ matrix.image }} : $total vulnerabilite(s) HIGH/CRITICAL"
          test "$total" -eq 0

  sbom:
    name: inventaire de ${{ matrix.image }}
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [clickfast, clickfast-scores-api, clickfast-stats-api]
    steps:
      - name: Generer le SBOM au format CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
          upload-artifact: false

      - name: Compter les composants inventories
        id: compte
        run: |
          fichier="sbom-${{ matrix.image }}.cdx.json"
          total=$(python3 -c "import json;print(len(json.load(open('$fichier')).get('components',[])))")
          librairies=$(python3 -c "import json;print(sum(1 for c in json.load(open('$fichier')).get('components',[]) if c.get('type')=='library'))")
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "librairies=$librairies" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.image }} : $total composants dont $librairies librairies"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 30

  resume-securite:
    name: resume de securite
    needs: [security-deps, security-image, sbom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les rapports produits
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: rapports

      - name: Ecrire le resume
        env:
          RESULTAT_DEPS: ${{ needs.security-deps.result }}
          RESULTAT_IMAGE: ${{ needs.security-image.result }}
          RESULTAT_SBOM: ${{ needs.sbom.result }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'FIN'
          import json, os, glob

          def lire(chemin):
              try:
                  return json.load(open(chemin))
              except Exception:
                  return None

          def etat(nom):
              v = os.environ.get(nom, "")
              return {"success": "vert", "failure": "ROUGE", "skipped": "non execute",
                      "cancelled": "annule"}.get(v, v or "inconnu")

          print("## Etat de securite de cette version\n")
          print("| Verification | Etat | Detail |")
          print("| --- | --- | --- |")

          d = lire("rapports/rapport-deps/rapport-deps.json")
          if d is None:
              detail = "chiffres non disponibles"
          else:
              detail = f"{d['racine_high_critical']} alerte(s) racine, {d['scores_high_critical']} alerte(s) scores-api"
          print(f"| Dependances (npm audit) | {etat('RESULTAT_DEPS')} | {detail} |")
          print(f"| Secrets (gitleaks) | {etat('RESULTAT_DEPS')} | inclus dans le meme job |")

          fichiers = sorted(glob.glob("rapports/rapport-image-*/rapport-image-*.json"))
          if not fichiers:
              print(f"| Vulnerabilites d image (Trivy) | {etat('RESULTAT_IMAGE')} | aucun rapport produit |")
          else:
              for f in fichiers:
                  r = lire(f)
                  if r is None:
                      print(f"| Vulnerabilites d image (Trivy) | {etat('RESULTAT_IMAGE')} | rapport illisible : {f} |")
                  else:
                      print(f"| Vulnerabilites d image : {r['image']} | {etat('RESULTAT_IMAGE')} | {r['critical']} CRITICAL, {r['high']} HIGH |")

          sboms = sorted(glob.glob("rapports/sbom-*/sbom-*.cdx.json"))
          if not sboms:
              print(f"| Inventaire (SBOM) | {etat('RESULTAT_SBOM')} | aucun inventaire produit |")
          else:
              for f in sboms:
                  s = lire(f)
                  if s is None:
                      print(f"| Inventaire (SBOM) | {etat('RESULTAT_SBOM')} | inventaire illisible : {f} |")
                  else:
                      composants = s.get("components") or []
                      libs = sum(1 for c in composants if c.get("type") == "library")
                      nom = f.split("/")[-1].replace("sbom-", "").replace(".cdx.json", "")
                      print(f"| Inventaire : {nom} | {etat('RESULTAT_SBOM')} | {len(composants)} composants dont {libs} librairies |")

          rouge = any(os.environ.get(k) == "failure" for k in ("RESULTAT_DEPS", "RESULTAT_IMAGE", "RESULTAT_SBOM"))
          print()
          print("**Publication en confiance : non, une verification est rouge.**" if rouge
                else "**Publication en confiance : oui, aucune verification en echec.**")
          FIN

      - name: Refuser si une verification de securite est rouge
        run: |
          test "${{ needs.security-deps.result }}" != "failure"
          test "${{ needs.security-image.result }}" != "failure"
          test "${{ needs.sbom.result }}" != "failure"
